name: Reusable Release Build

on:
  workflow_call:
    inputs:
      archive_suffix:
        type: string
        default: ""
      pages_commit_message:
        type: string
        required: true
      rolling_tag:
        type: string
        default: ""
      release_name:
        type: string
        default: ""
      release_body:
        type: string
        default: ""
      prerelease:
        type: boolean
        default: false
      make_latest:
        type: boolean
        default: true

concurrency:
  group: release-${{ inputs.rolling_tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-26.04
            artifact_name: apk
          - target: windows
            os: windows-latest
            artifact_name: windows
            arch: x64
          - target: windows
            os: windows-11-arm
            artifact_name: windows-arm64
            arch: arm64
          - target: linux
            os: ubuntu-26.04
            artifact_name: linux
            arch: x64
          - target: linux
            os: ubuntu-26.04-arm
            artifact_name: linux-arm64
            arch: arm64
          - target: web
            os: ubuntu-26.04
            artifact_name: web
          - target: macos
            os: macos-26
            artifact_name: macos
            arch: arm64
          - target: macos
            os: macos-26-intel
            artifact_name: macos-x64
            arch: x64

    env:
      TARGET_ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Read version
        shell: bash
        env:
          ARCHIVE_SUFFIX: ${{ inputs.archive_suffix }}
        run: |
          version="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          test -n "$version" || { echo 'Missing pubspec version' >&2; exit 1; }
          artifact_version="$version"
          if [ -n "$ARCHIVE_SUFFIX" ]; then
            artifact_version="${ARCHIVE_SUFFIX#-}"
          fi
          echo "STASHFLOW_ARTIFACT_VERSION=$artifact_version" >> "$GITHUB_ENV"

      - name: Setup Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Flutter
        if: matrix.arch != 'arm64' || (matrix.target != 'windows' && matrix.target != 'linux')
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      # The release archive bundles x64 Dart; bootstrap native Dart on ARM64.
      - name: Setup Flutter on Windows ARM64
        if: matrix.target == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $flutterRoot = Join-Path $env:RUNNER_TEMP 'flutter-arm64'
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git $flutterRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$flutterRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "FLUTTER_ROOT=$flutterRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$flutterRoot\bin\flutter.bat" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dartVersion = & "$flutterRoot\bin\cache\dart-sdk\bin\dart.exe" --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($dartVersion -notmatch 'windows_arm64') { throw "Expected native ARM64 Dart: $dartVersion" }

      - name: Setup Flutter on Linux ARM64
        if: matrix.target == 'linux' && matrix.arch == 'arm64'
        shell: bash
        run: |
          flutter_root="$RUNNER_TEMP/flutter-arm64"
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$flutter_root"
          echo "$flutter_root/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$flutter_root" >> "$GITHUB_ENV"
          "$flutter_root/bin/flutter" --version
          "$flutter_root/bin/cache/dart-sdk/bin/dart" --version 2>&1 | grep -q 'linux_arm64'

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build

      - name: Android build setup
        if: matrix.target == 'android'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Linux build setup
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libsecret-1-dev \
            libva-drm2 \
            libva-x11-2 \
            libva-wayland2 \
            libvdpau1 \
            libpulse0 \
            libxss1 \
            libxv1 \
            libegl1 \
            libgbm1 \
            libwayland-egl1 \
            libarchive-tools \
            fakeroot \
            zstd

      - name: Test release artifact metadata
        if: matrix.target == 'linux'
        run: |
          python3 scripts/test_release_artifacts.py
          python3 scripts/test_windows_bundle.py
          python3 scripts/test_linux_bundle.py

      - name: Generate macOS Flutter ephemeral files
        if: matrix.target == 'macos'
        run: flutter build macos --config-only

      - name: Build
        run: |
          if [ "${{ matrix.target }}" = "android" ]; then
            flutter build apk --release --split-per-abi
          elif [ "${{ matrix.target }}" = "windows" ]; then
            flutter build windows --release
          elif [ "${{ matrix.target }}" = "linux" ]; then
            flutter build linux --release
          elif [ "${{ matrix.target }}" = "web" ]; then
            flutter build web --release --base-href /StashFlow/
          elif [ "${{ matrix.target }}" = "macos" ]; then
            case "$TARGET_ARCH" in
              x64) macos_arch=x86_64 ;;
              arm64) macos_arch=arm64 ;;
              *) echo "Unsupported macOS architecture: $TARGET_ARCH" >&2; exit 1 ;;
            esac
            FLUTTER_MACOS_ARM64_ONLY=false FLUTTER_XCODE_ARCHS="$macos_arch" flutter build macos --release
          fi
        shell: bash

      - name: Package Windows
        if: matrix.target == 'windows'
        run: |
          python scripts/validate_windows_bundle.py build/windows/${{ matrix.arch }}/runner/Release ${{ matrix.arch }}
          cd build/windows/${{ matrix.arch }}/runner/Release
          7z a ../../../../../StashFlow-${STASHFLOW_ARTIFACT_VERSION}-windows-${{ matrix.arch }}.zip *
        shell: bash

      - name: Package Linux
        if: matrix.target == 'linux'
        run: |
          python3 scripts/validate_linux_bundle.py "build/linux/$TARGET_ARCH/release/bundle" "$TARGET_ARCH"
          cd "build/linux/$TARGET_ARCH/release/bundle"
          zip -r "../../../../../StashFlow-${STASHFLOW_ARTIFACT_VERSION}-linux-${TARGET_ARCH}.zip" .
        shell: bash

      - name: Package Web
        if: matrix.target == 'web'
        run: |
          cd build/web
          zip -r ../../StashFlow-${STASHFLOW_ARTIFACT_VERSION}-web.zip .
        shell: bash

      - name: Deploy to GitHub Pages
        if: matrix.target == 'web'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: ${{ inputs.pages_commit_message }}

      - name: Package macOS
        if: matrix.target == 'macos'
        run: |
          case "$TARGET_ARCH" in
            x64) macos_arch=x86_64 ;;
            arm64) macos_arch=arm64 ;;
            *) echo "Unsupported macOS architecture: $TARGET_ARCH" >&2; exit 1 ;;
          esac
          cd build/macos/Build/Products/Release
          test -f StashFlow.app/Contents/MacOS/StashFlow
          lipo StashFlow.app/Contents/MacOS/StashFlow -verify_arch "$macos_arch"
          find StashFlow.app -type f -print0 | while IFS= read -r -d '' binary; do
            if file -b "$binary" | grep -q 'Mach-O'; then
              lipo "$binary" -verify_arch "$macos_arch"
            fi
          done
          zip -r "../../../../../StashFlow-${STASHFLOW_ARTIFACT_VERSION}-macos-${macos_arch}.zip" StashFlow.app
        shell: bash

      - name: Name Android binaries
        if: matrix.target == 'android'
        run: |
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="${apk#*app-}"
            abi="${abi%-release.apk}"
            mv "$apk" "build/app/outputs/flutter-apk/StashFlow-${STASHFLOW_ARTIFACT_VERSION}-android-${abi}.apk"
          done
        shell: bash

      - name: Package Linux dists
        if: matrix.target == 'linux'
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          sudo mkdir -p /usr/local/lib/stashflow
          sudo wget -qO /usr/local/lib/stashflow/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$(uname -m).AppImage"
          sudo chmod +x /usr/local/lib/stashflow/appimagetool
          sudo install -m755 scripts/appimagetool.sh /usr/local/bin/appimagetool
          export APPIMAGE_EXTRACT_AND_RUN=1
          dart pub global activate fastforge 0.6.12
          fastforge package --platform linux --targets deb,appimage --artifact-name 'StashFlow-{{build_name}}{{#has_build_number}}+{{build_number}}{{/has_build_number}}-{{platform}}{{#is_installer}}-setup{{/is_installer}}.{{ext}}'
          find dist -type f \( -name '*.deb' -o -name '*.AppImage' \) -print0 | while IFS= read -r -d '' file; do
            extension="${file##*.}"
            mv "$file" "$(dirname "$file")/StashFlow-${STASHFLOW_ARTIFACT_VERSION}-linux-${TARGET_ARCH}.${extension}"
          done
          python3 scripts/validate_linux_bundle.py "build/linux/$TARGET_ARCH/release/bundle" "$TARGET_ARCH"
          scripts/build_linux_pacman.sh "$STASHFLOW_ARTIFACT_VERSION" "$PWD/dist" "$TARGET_ARCH"
        shell: bash

      - name: Validate Linux dists
        if: matrix.target == 'linux'
        run: |
          appimage=$(find dist -type f -name '*.AppImage' -print -quit)
          package=$(find dist -type f -name '*.pkg.tar.zst' -print -quit)
          deb=$(find dist -type f -name '*.deb' -print -quit)
          test -n "$appimage" || { echo 'AppImage artifact not found' >&2; exit 1; }
          test -n "$package" || { echo 'Pacman artifact not found' >&2; exit 1; }
          test -n "$deb" || { echo 'Debian artifact not found' >&2; exit 1; }
          case "$TARGET_ARCH" in
            x64) package_arch=x86_64; deb_arch=amd64 ;;
            arm64) package_arch=aarch64; deb_arch=arm64 ;;
            *) echo "Unsupported Linux architecture: $TARGET_ARCH" >&2; exit 1 ;;
          esac
          test "$(dpkg-deb -f "$deb" Architecture)" = "$deb_arch"
          python3 scripts/validate_linux_bundle.py "build/linux/$TARGET_ARCH/release/bundle" "$TARGET_ARCH" --appimage "$appimage"
          echo "Validating $appimage"
          echo "Validating $package"

          chmod +x "$appimage"
          appimage_extract_directory=$(mktemp -d)
          (
            cd "$appimage_extract_directory"
            "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
            test -x squashfs-root/StashFlow || { echo 'AppImage is missing the StashFlow executable' >&2; exit 1; }
            test -x squashfs-root/stash_app_flutter || { echo 'AppImage is missing the Fastforge launcher executable' >&2; exit 1; }
            cmp squashfs-root/StashFlow squashfs-root/stash_app_flutter
            python3 "$GITHUB_WORKSPACE/scripts/validate_linux_bundle.py" squashfs-root "$TARGET_ARCH"
            readelf -d squashfs-root/stash_app_flutter | grep -F '[$ORIGIN/lib]'
          )

          bsdtar -xOf "$package" .PKGINFO | grep -Fx 'pkgname = stashflow'
          bsdtar -xOf "$package" .PKGINFO | grep -Fx "arch = $package_arch"
          bsdtar -xOf "$package" .PKGINFO | grep -Fx 'depend = gtk3'
          bsdtar -xOf "$package" .PKGINFO | grep -Fx 'depend = libsecret'
          test "$(bsdtar --numeric-owner -tvf "$package" | awk '$NF == "opt/StashFlow/StashFlow" { print $3 ":" $4 }')" = '0:0'
        shell: bash

      - name: Checksum Linux dists
        if: matrix.target == 'linux'
        shell: bash
        run: |
          find dist -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.pkg.tar.zst' \) -print0 | while IFS= read -r -d '' file; do
            (
              cd "$(dirname "$file")"
              sha256sum "$(basename "$file")" > "$(basename "$file").sha256"
            )
          done

      - name: Package Windows dists
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ matrix.arch }}' -eq 'arm64') {
            Add-Content windows/packaging/exe/make_config.yaml "`narchitectures_allowed: arm64`narchitectures_install_in_64bit_mode: arm64"
          }
          $env:PATH += ";$env:LOCALAPPDATA\Pub\Cache\bin"
          dart pub global activate fastforge 0.6.12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          fastforge package --platform windows --targets exe --artifact-name 'StashFlow-{{build_name}}{{#has_build_number}}+{{build_number}}{{/has_build_number}}-{{platform}}{{#is_installer}}-setup{{/is_installer}}.{{ext}}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate_windows_bundle.py build/windows/${{ matrix.arch }}/runner/Release ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist -Recurse -Filter *.exe | Rename-Item -NewName "StashFlow-$env:STASHFLOW_ARTIFACT_VERSION-windows-${{ matrix.arch }}.exe"

      - name: Upload dist packages
        if: matrix.target == 'linux' || matrix.target == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: StashFlow${{ inputs.archive_suffix }}-${{ matrix.artifact_name }}-dist
          path: dist/**/StashFlow-*

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: StashFlow${{ inputs.archive_suffix }}-${{ matrix.artifact_name }}
          path: |
            build/app/outputs/flutter-apk/StashFlow-*.apk
            StashFlow-*.zip

  release:
    needs: build
    if: inputs.rolling_tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Get short SHA
        if: inputs.rolling_tag != ''
        id: slug
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository for tag update
        if: inputs.rolling_tag != ''
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Update rolling tag
        if: inputs.rolling_tag != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ inputs.rolling_tag }}" "${{ github.sha }}"
          git push --force origin "refs/tags/${{ inputs.rolling_tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        if: inputs.rolling_tag == ''
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Rolling Release
        if: inputs.rolling_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.rolling_tag }}
          name: ${{ inputs.release_name }} (${{ steps.slug.outputs.sha_short }})
          body: ${{ inputs.release_body }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.make_latest }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove obsolete rolling assets
        if: inputs.rolling_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ROLLING_TAG: ${{ inputs.rolling_tag }}
        shell: bash
        run: |
          find artifacts -type f -printf '%f\n' > "$RUNNER_TEMP/current-release-assets.txt"
          gh release view "$ROLLING_TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            if ! grep -Fxq -- "$asset" "$RUNNER_TEMP/current-release-assets.txt"; then
              gh release delete-asset "$ROLLING_TAG" "$asset" --yes
            fi
          done
