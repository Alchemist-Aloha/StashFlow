fragment GroupData on Group {
  id
  name
  date
  rating100
  director
  synopsis
  scene_count
  sub_group_count
  front_image_path
}

fragment GroupRelationData on Group {
  id
  name
  front_image_path
}

fragment GroupDetailData on Group {
  ...GroupData
  back_image_path
  aliases
  duration
  urls
  studio {
    id
    name
    image_path
  }
  tags {
    id
    name
  }
  containing_groups {
    group {
      ...GroupRelationData
    }
    description
  }
  sub_groups {
    group {
      ...GroupRelationData
    }
    description
  }
}

query FindGroups($filter: FindFilterType, $group_filter: GroupFilterType) {
  findGroups(filter: $filter, group_filter: $group_filter) {
    count
    groups {
      ...GroupData
    }
  }
}

query FindGroup($id: ID!) {
  findGroup(id: $id) {
    ...GroupDetailData
  }
}
