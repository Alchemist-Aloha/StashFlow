name: stash_app_flutter
description: "A modern Flutter client app for browsing and managing your Stash library."
publish_to: 'none'
version: 1.43.0+116

msix_config:
  display_name: StashFlow
  identity_name: com.stashflow.app
  publisher_display_name: StashFlow
  msix_version: 1.43.0.116
  logo_path: asset/stashfluttericon.png

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^3.3.2
  go_router: ^18.0.1
  graphql_flutter: ^5.3.0
  media_kit:
    git:
      url: https://github.com/Alchemist-Aloha/media-kit.git
      ref: 0a66ca7270b6b68040d0801b8e2f9328ad883f9f
      path: ./media_kit
  media_kit_video:
    git:
      url: https://github.com/Alchemist-Aloha/media-kit.git
      ref: 0a66ca7270b6b68040d0801b8e2f9328ad883f9f
      path: ./media_kit_video
  audio_session: ^0.2.4
  audio_service: ^0.18.19
  audio_service_mpris: ^1.0.0-beta.4
  wakelock_plus: ^1.8.2
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  path: ^1.9.1
  gql: ^1.0.1
  freezed_annotation: ^3.1.0
  riverpod_annotation: ^4.0.3
  graphql: ^5.2.4
  url_launcher: ^6.3.2
  cached_network_image_ce: ^4.13.2
  http: ^1.6.0
  flutter_staggered_grid_view: ^0.8.0-dev.3
  skeletonizer: ^3.0.0
  flutter_secure_storage: ^11.0.0
  package_info_plus: ^10.1.0
  pub_semver: ^2.2.0
  window_manager: ^0.7.0
  multiview_desktop: ^2.0.2
  dio: ^5.10.0
  dio_cookie_manager: ^3.4.0
  cookie_jar: ^4.0.9
  vector_math: ^2.2.0
  screen_brightness: ^2.1.11
  dart_cast: ^0.7.3
  gal: ^2.3.2
  file_selector: ^1.1.0
  share_plus: ^13.0.0
  json_annotation: ^4.12.0
  sherpa_onnx: ^2.0.1
  crypto: ^3.0.8
  stashflow_translation:
    path: packages/stashflow_translation
  local_auth: ^3.0.2
  material_ui: ^1.11.0
  flutter_svg: ^2.4.0
  cupertino_icons: ^2.0.0
  avif_native:
    git:
      url: https://github.com/Alchemist-Aloha/avif_native.git
      ref: 3b4fece030f6fae6894cc79a268b87ab9c86a277
  jxl_native:
    git:
      url: https://github.com/Alchemist-Aloha/jxl_native.git
      ref: e34012728ea72c4497b1183136aac008eac8abf8

dev_dependencies:
  msix: ^3.18.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.3
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  freezed: ^4.0.1
  json_serializable: ^6.15.1
  riverpod_generator: ^4.0.4
  graphql_codegen: ^3.0.1
  flutter_launcher_icons: ^0.14.4
  mockito: ^5.8.1
  fake_async: ^1.3.3



flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "asset/stashfluttericon.png"
  windows:
    generate: true
    image_path: "asset/stashfluttericon.png"
  macos:
    generate: true
    image_path: "asset/stashfluttericon.png"
  image_path: "asset/stashfluttericon.png"
  min_sdk_android: 24



flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: asset/fonts/manrope/Manrope.ttf
    - family: Outfit
      fonts:
        - asset: asset/fonts/outfit/Outfit.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: asset/fonts/space_grotesk/SpaceGrotesk.ttf
    - family: Inter
      fonts:
        - asset: asset/fonts/inter/Inter.ttf
    - family: Lora
      fonts:
        - asset: asset/fonts/lora/Lora.ttf
    - family: JetBrainsMono
      fonts:
        - asset: asset/fonts/jetbrains_mono/JetBrainsMono.ttf
  assets:
    - asset/licenses/local_captions.txt
    - asset/licenses/performer_placeholders.txt
    - asset/performer_placeholders/female/
    - asset/performer_placeholders/male/
    - asset/fonts/manrope/OFL.txt
    - asset/fonts/outfit/OFL.txt
    - asset/fonts/space_grotesk/OFL.txt
    - asset/fonts/inter/OFL.txt
    - asset/fonts/lora/OFL.txt
    - asset/fonts/jetbrains_mono/OFL.txt

# Decode-only libavif build (dav1d); StashFlow never encodes AVIF.
hooks:
  user_defines:
    avif_native:
      features: decode
