name: stash_app_flutter
description: "A modern Flutter client app for browsing and managing your Stash library."
publish_to: 'none'
version: 1.33.0+105

msix_config:
  display_name: StashFlow
  identity_name: com.stashflow.app
  publisher_display_name: StashFlow
  msix_version: 1.33.0.105
  logo_path: asset/stashfluttericon.png

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  graphql_flutter: ^5.3.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  audio_service: ^0.18.19
  audio_service_mpris: ^0.2.1
  wakelock_plus: ^1.6.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  path: ^1.9.1
  gql: ^1.0.1
  freezed_annotation: ^3.1.0
  riverpod_annotation: ^4.0.3
  graphql: ^5.2.4
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  http: ^1.6.0
  flutter_staggered_grid_view: ^0.7.0
  skeletonizer: ^2.1.3
  extended_image: ^10.1.0
  flutter_secure_storage: ^10.3.1
  package_info_plus: ^10.1.0
  pub_semver: ^2.2.0
  window_manager: ^0.5.2
  dio: ^5.10.0
  dio_cookie_manager: ^3.4.0
  cookie_jar: ^4.0.9
  vector_math: ^2.2.0
  screen_brightness: ^2.1.11
  dart_cast: ^0.7.3
  gal: ^2.3.2
  file_selector: ^1.1.0
  share_plus: ^13.0.0
  msix: ^3.18.0
  fastforge: ^0.6.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.4
  graphql_codegen: ^3.0.1
  flutter_launcher_icons: ^0.14.4
  mockito: ^5.6.4
  fake_async: ^1.3.3



flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
    image_path: "asset/stashfluttericon.png"
  windows:
    generate: true
    image_path: "asset/stashfluttericon.png"
  macos:
    generate: true
    image_path: "asset/stashfluttericon.png"
  image_path: "asset/stashfluttericon.png"
  min_sdk_android: 24

flutter:
  generate: true
  uses-material-design: true
